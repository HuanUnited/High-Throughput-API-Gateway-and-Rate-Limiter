# Prometheus configuration for the gateway monitoring stack
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Alertmanager configuration (disabled for now)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Rule files (for custom alerting rules)
rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

# Scrape configurations
scrape_configs:
  # Gateway service metrics
  - job_name: 'gateway'
    scrape_interval: 5s
    static_configs:
      - targets: ['gateway:8080']
        labels:
          service: 'gateway'
          environment: 'docker'

  # Prometheus self-monitoring (optional)
  - job_name: 'prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:9090']

  # PostgreSQL metrics (via postgres_exporter, if deployed)
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']

  # Node exporter for host metrics (optional)
  # - job_name: 'node'
  #   static_configs:
  #     - targets: ['node-exporter:9100']