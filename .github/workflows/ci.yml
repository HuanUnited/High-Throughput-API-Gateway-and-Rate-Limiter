name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  GO_VERSION: '1.25'
  DOCKER_IMAGE: gateway:${{ github.sha }}

jobs:
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true



      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.0
          args: --timeout=5m --config=.golangci.yml
          only-new-issues: false

  test:
    name: Unit & Integration Tests (Postgres + Redis)
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rate_limiter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install PostgreSQL client
        run: |
          command -v sudo >/dev/null 2>&1 && sudo apt-get update && sudo apt-get install -y postgresql-client || (apt-get update && apt-get install -y postgresql-client)

      - name: Execute migrations on test DB
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d rate_limiter_test -f migrations/000001_create_clients_table.up.sql

      - name: Run tests with live Postgres & Redis
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/rate_limiter_test?sslmode=disable
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out

      - name: Check coverage threshold (min 80%)
        run: |
          total_coverage=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${total_coverage}%"
          if (( $(echo "$total_coverage < 80" | bc -l) )); then
            echo "Coverage below 80% threshold"
            exit 1
          fi

  build:
    name: Docker Build & Container Verification
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          file: ./Dockerfile
          push: false
          tags: ${{ env.DOCKER_IMAGE }}

      - name: Test container startup and built-in healthcheck
        run: |
          docker run -d --name test-gateway \
            -e PORT=8080 \
            -p 18080:8080 \
            ${{ env.DOCKER_IMAGE }}
          
          sleep 5
          
          if curl -f http://localhost:18080/healthz; then
            echo "Container health check passed"
          else
            echo "Container health check failed"
            docker logs test-gateway
            exit 1
          fi
          docker rm -f test-gateway